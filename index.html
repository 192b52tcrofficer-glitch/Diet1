<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <title>輕盈日記</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>輕盈日記</h1>
    <div class="date-nav" id="dateNav">
      <button type="button" data-action="prev-day" aria-label="前一天">‹</button>
      <span id="dateLabel"></span>
      <button type="button" data-action="next-day" aria-label="後一天">›</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button type="button" data-tab="today"><span>🏠</span>今日</button>
    <button type="button" data-tab="food"><span>🍱</span>飲食</button>
    <button type="button" data-tab="exercise"><span>🏃</span>運動</button>
    <button type="button" data-tab="weight"><span>⚖️</span>體重</button>
    <button type="button" data-tab="fasting"><span>⏱️</span>斷食</button>
    <button type="button" data-tab="settings"><span>⚙️</span>設定</button>
  </nav>

  <dialog id="modal"><div id="modalBody"></div></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script src="js/calc.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
